<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>職安現場巡檢 - 管理後台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        .app-bg {
            background-color: #f0f4f8;
            background-image: linear-gradient(135deg, rgba(255, 255, 255, 0.85) 0%, rgba(219, 234, 254, 0.95) 100%), url('https://images.unsplash.com/photo-1436491865332-7a61a109cc05?q=80&w=2074&auto=format&fit=crop');
            background-size: cover; background-position: center; background-attachment: fixed;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.8); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }
        
        /* 🚀 恢復最穩定的原生 PDF 容器與自動防切斷機制 */
        #pdfExportContainer { display: none; width: 800px; margin: 0 auto; padding: 0; background: white; text-align: left; }
        .avoid-break { page-break-inside: avoid !important; break-inside: avoid !important; display: block; }
        .html2pdf__page-break { page-break-before: always !important; height: 0 !important; margin: 0 !important; border: 0 !important; padding: 0 !important; }
    </style>
</head>
<body id="mainBody" class="app-bg min-h-screen flex items-start sm:items-center justify-center p-3 sm:p-4 transition-all">

    <!-- 全螢幕載入遮罩 -->
    <div id="loadingOverlay" class="fixed inset-0 bg-white z-[99999] hidden flex-col items-center justify-center">
        <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-blue-600 mb-4"></div>
        <h2 class="text-2xl font-extrabold text-gray-800 tracking-wider">📄 報表精密繪製中</h2>
        <p class="text-gray-500 mt-2 font-bold">系統排版中，請勿關閉網頁...</p>
    </div>

    <!-- 實體的 PDF 渲染容器 -->
    <div id="pdfExportContainer"></div>

    <!-- 後台管理主畫面 -->
    <div id="adminSection" class="glass-panel w-full max-w-4xl rounded-2xl p-5 sm:p-8 mt-4 sm:mt-0">
        <!-- 🚀 已刪除右上角文字，介面極致乾淨 -->
        <div class="flex items-center justify-center mb-6 border-b-2 border-gray-200 pb-4">
            <h2 class="text-2xl sm:text-3xl font-extrabold text-gray-800 flex items-center gap-3">
                <img src="https://lh3.googleusercontent.com/d/1EGg_mHTfjhqscarvitDCKKAqWN7eLFSl" alt="Logo" class="h-8 sm:h-10" crossorigin="anonymous">
                職安巡檢管理後台
            </h2>
        </div>

        <div class="bg-gray-50 p-4 rounded-2xl border border-gray-200 mb-5 shadow-sm space-y-3">
            <div class="flex items-center justify-between font-extrabold text-gray-800 text-base sm:text-lg">
                <button onclick="changeCalendarMonth(-1)" class="px-4 py-2 bg-white border border-gray-300 rounded-xl hover:bg-gray-100 shadow-sm active:scale-95">◀</button>
                <span id="calendarMonthLabel" class="text-blue-900 tracking-wide text-xl"></span>
                <button onclick="changeCalendarMonth(1)" class="px-4 py-2 bg-white border border-gray-300 rounded-xl hover:bg-gray-100 shadow-sm active:scale-95">▶</button>
            </div>
            <div class="grid grid-cols-7 text-center font-bold text-sm sm:text-base text-gray-500 border-b pb-2 mt-2">
                <span class="text-red-500">日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span class="text-blue-500">六</span>
            </div>
            <div id="calendarGrid" class="grid grid-cols-7 gap-1 sm:gap-2 text-center text-base font-bold mt-2"></div>
            
            <div class="flex flex-wrap items-center justify-between pt-4 border-t text-sm text-gray-600 gap-2 mt-2">
                <span class="flex items-center gap-2 font-bold"><span class="w-3 h-3 rounded-full bg-green-500 inline-block shadow-sm"></span> 🟢 綠點表示當天有巡檢紀錄</span>
                <div class="flex items-center gap-2">
                    <span class="font-bold text-gray-700">特定日期：</span>
                    <input type="date" id="reportDate" onchange="onDateInputChange()" class="border px-3 py-2 rounded-lg bg-white font-bold text-gray-800 outline-none shadow-sm">
                </div>
            </div>
        </div>
        
        <div id="reportContent" class="bg-white p-4 sm:p-6 rounded-xl border min-h-[200px] text-gray-700 shadow-inner">
            請選擇日期並點擊查詢。
        </div>
        
        <button id="downloadPdfBtn" onclick="downloadAdminReport()" class="w-full mt-6 bg-green-600 hover:bg-green-700 text-white font-bold py-4 rounded-xl hidden shadow-lg transition text-lg active:scale-95">
            📤 匯出並分享 PDF 報表
        </button>
    </div>

    <script>
        // === ⚠️ 請務必替換為您專屬的 Google Apps Script 網址 ===
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzkVb8Gtg1IgGi-qP8A6HtClBzetZf2uXiqdKco11ueU_yqfQPRbuwhsNs1WKFWDZEH/exec'; 
        
        let questionData = []; 
        let recordedDatesCache = {}; // 記憶體快取
        let calYear = new Date().getFullYear(); let calMonth = new Date().getMonth(); 
        let currentPdfBlob = null; let currentPdfFileName = '';

        // 免登入，一開網頁直接初始化
        window.onload = function() {
            setTodayDate(); 
            fetchRecordedDatesAndRender();
        };

        function setTodayDate() {
            const today = new Date(); const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0'); const dd = String(today.getDate()).padStart(2, '0');
            document.getElementById('reportDate').value = `${yyyy}-${mm}-${dd}`;
            calYear = today.getFullYear(); calMonth = today.getMonth();
        }

        function fetchWithRetry(url, retries = 2) {
            return fetch(url, { redirect: 'follow', cache: 'no-store' })
                .then(res => { if (!res.ok) throw new Error(`HTTP ${res.status}`); return res.text(); })
                .catch(err => {
                    if (retries > 0) return new Promise(resolve => setTimeout(resolve, 1000)).then(() => fetchWithRetry(url, retries - 1));
                    throw err; 
                });
        }

        function fetchRecordedDatesAndRender() {
            const cacheKey = `${calYear}-${calMonth}`;
            if (recordedDatesCache[cacheKey]) {
                renderCalendar(); 
                fetchReports();
                return;
            }

            const timestamp = new Date().getTime();
            fetchWithRetry(`${GOOGLE_SCRIPT_URL}?action=getRecordedDates&t=${timestamp}`)
                .then(text => JSON.parse(text))
                .then(dates => { 
                    recordedDatesCache[cacheKey] = Array.isArray(dates) ? dates : []; 
                    renderCalendar(); 
                    fetchReports(); 
                }).catch(err => { 
                    recordedDatesCache[cacheKey] = []; 
                    renderCalendar(); 
                    fetchReports(); 
                });
        }

        function changeCalendarMonth(delta) { 
            calMonth += delta; 
            if (calMonth < 0) { calMonth = 11; calYear--; } 
            else if (calMonth > 11) { calMonth = 0; calYear++; } 
            fetchRecordedDatesAndRender(); 
        }

        function onDateInputChange() { 
            const val = document.getElementById('reportDate').value; 
            if(val) { 
                const parts = val.split('-'); 
                calYear = parseInt(parts[0]); calMonth = parseInt(parts[1]) - 1; 
                fetchRecordedDatesAndRender(); 
                fetchReports(); 
            } 
        }

        function selectDateFromCalendar(dateStr) { 
            document.getElementById('reportDate').value = dateStr; 
            renderCalendar(); 
            fetchReports(); 
        }

        function renderCalendar() {
            const label = document.getElementById('calendarMonthLabel'); label.textContent = `${calYear}年 ${String(calMonth + 1).padStart(2, '0')}月`;
            const grid = document.getElementById('calendarGrid'); grid.innerHTML = '';
            const selectedDate = document.getElementById('reportDate').value; 
            const firstDayIndex = new Date(calYear, calMonth, 1).getDay(); 
            const totalDays = new Date(calYear, calMonth + 1, 0).getDate();
            
            const cacheKey = `${calYear}-${calMonth}`;
            const currentMonthDates = recordedDatesCache[cacheKey] || [];

            for (let i = 0; i < firstDayIndex; i++) { grid.insertAdjacentHTML('beforeend', `<div></div>`); }
            for (let day = 1; day <= totalDays; day++) {
                const dateStr = `${calYear}-${String(calMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const hasRecord = currentMonthDates.includes(dateStr); 
                const isSelected = (dateStr === selectedDate);
                
                let btnClass = "py-2.5 rounded-xl flex flex-col items-center justify-center relative cursor-pointer transition active:scale-95 border shadow-sm ";
                if (isSelected) { btnClass += "bg-blue-600 text-white font-extrabold border-blue-600 shadow-md "; } 
                else if (hasRecord) { btnClass += "bg-green-100 text-green-900 font-extrabold border-green-300 hover:bg-green-200 "; } 
                else { btnClass += "bg-white text-gray-700 border-gray-100 hover:bg-gray-50 "; }
                
                let dotHtml = hasRecord ? `<span class="absolute top-1 right-1 w-2.5 h-2.5 rounded-full ${isSelected ? 'bg-white' : 'bg-green-600'}"></span>` : ``;
                grid.insertAdjacentHTML('beforeend', `<div onclick="selectDateFromCalendar('${dateStr}')" class="${btnClass}"><span>${day}</span>${dotHtml}</div>`);
            }
        }

        // ==========================================
        // 🚀 PDF 恢復最完美穩定的原生 HTML 組裝架構
        // ==========================================
        const PDF_HEADER_TEMPLATE = `
            <div style="display: flex; align-items: center; justify-content: center; border-bottom: 2px solid #e5e7eb; padding-bottom: 15px; margin-bottom: 25px;">
                <img src="https://lh3.googleusercontent.com/d/1EGg_mHTfjhqscarvitDCKKAqWN7eLFSl" style="height: 35px; margin-right: 15px;" crossorigin="anonymous">
                <span style="font-size: 24px; font-weight: bold; color: #1f2937;">現場職安巡檢日報表</span>
            </div>
        `;

        function fetchReports() {
            const date = document.getElementById('reportDate').value; if (!date) return;
            const reportContent = document.getElementById('reportContent'); reportContent.innerHTML = '🔄 資料同步與報表生成中，請稍候...';
            
            currentPdfBlob = null;
            let dlBtn = document.getElementById('downloadPdfBtn');
            dlBtn.innerHTML = '📤 匯出並分享 PDF 報表';
            dlBtn.className = "w-full mt-6 bg-green-600 hover:bg-green-700 text-white font-bold py-4 rounded-xl hidden shadow-lg transition text-lg active:scale-95";

            const timestamp = new Date().getTime();
            let loadQ = questionData.length === 0 ? fetchWithRetry(`${GOOGLE_SCRIPT_URL}?t=${timestamp}`).then(text => { questionData = JSON.parse(text); }) : Promise.resolve();

            loadQ.then(() => fetchWithRetry(`${GOOGLE_SCRIPT_URL}?action=getReports&date=${date}&t=${timestamp}`))
            .then(text => JSON.parse(text))
            .then(async (data) => {
                if (!Array.isArray(data) || data.length === 0) { 
                    reportContent.innerHTML = `<div class="text-center py-10"><p class="text-gray-500 font-extrabold text-xl mb-2">📅 ${date} 尚無任何巡檢紀錄</p><p class="text-base text-gray-400">系統中無當日資料。</p></div>`; 
                    document.getElementById('downloadPdfBtn').classList.add('hidden'); return; 
                }
                
                let webHtml = ''; let pdfHtmlStr = ''; 
                const getVal = (row, colName) => { for (let k in row) { if (k.replace(/\s/g, '') === colName) return row[k]; } return ''; };

                for (let i = 0; i < data.length; i++) {
                    const row = data[i]; const task = getVal(row, '作業項目');
                    const filteredQ = questionData.filter(q => !q.applicable || q.applicable === "通用" || q.applicable.includes(task));
                    let ans = {}, notes = {}; try { ans = JSON.parse(getVal(row, '檢查結果JSON') || '{}'); } catch(e){} try { notes = JSON.parse(getVal(row, '異常說明JSON') || '{}'); } catch(e){}

                    let weatherHtmlWeb = ''; let weatherHtmlPdfInline = '';
                    if (notes['_weather']) {
                        try {
                            let w = JSON.parse(notes['_weather']);
                            let windText = `${w.wind} m/s`; let windStyle = "font-bold text-gray-800"; let pdfWindStyle = "font-weight: bold; color: #1f2937;";
                            if (w.wind >= 10) { windText = `${w.wind} m/s (⚠️ 達強風標準)`; windStyle = "font-extrabold text-red-600"; pdfWindStyle = "font-weight: bold; color: #dc2626;"; }
                            
                            let heatWarningHtmlPdf = "";
                            if (w.heatIndex >= 54.4) heatWarningHtmlPdf += `<p style="font-size: 11px; font-weight: bold; color: #dc2626; margin: 4px 0 0 0;">⚠️ 熱危害風險等級達第四級，11時至14時停止戶外高溫作業。</p>`;
                            if (w.temp >= 34) heatWarningHtmlPdf += `<p style="font-size: 11px; font-weight: bold; color: #dc2626; margin: 2px 0 0 0;">⚠️ 現場氣溫達攝氏34度時停止戶外高溫作業。</p>`;

                            weatherHtmlWeb = `<div class="bg-blue-50 p-4 rounded-xl mt-3 border border-blue-200 text-sm shadow-sm"><p class="mb-1 text-gray-700">🌡️ 實際溫度：<span class="font-bold">${w.temp}°C</span> / 濕度：<span class="font-bold">${w.hum}%</span></p><p class="mb-1 text-gray-700">🔥 換算熱指數：<span class="${w.heatColor} font-extrabold text-base">${w.heatIndex} (${w.heatLevel})</span></p><p class="text-gray-700">💨 十分鐘平均風速：<span class="${windStyle}">${windText}</span></p></div>`;
                            weatherHtmlPdfInline = `<p style="font-size: 11px; color: #6b7280; margin: 6px 0 0 0; padding-top: 6px; border-top: 1px solid #e5e7eb;">🌤️ 氣溫：${w.temp}°C | 💧 濕度：${w.hum}% | 🔥 熱指數：<span style="font-weight: bold;">${w.heatIndex} (${w.heatLevel})</span> | 💨 風速：<span style="${pdfWindStyle}">${windText}</span></p>${heatWarningHtmlPdf}`;
                        } catch(e) {}
                    }

                    let gpsStr = getVal(row, 'GPS地圖') || getVal(row, 'GPS') || ''; let lat = "", lon = "", latLon = "";
                    if(gpsStr.includes('query=')) { let match = gpsStr.match(/query=([^&"]+)/); if(match && match[1]) { latLon = match[1]; let parts = latLon.split(','); if(parts.length===2) { lat=parts[0].trim(); lon=parts[1].trim(); } } }
                    else if (gpsStr.includes(',')) { latLon = gpsStr.trim(); let parts = latLon.split(','); if(parts.length===2) { lat=parts[0].trim(); lon=parts[1].trim(); } }
                    
                    let qrCodeImg = '';
                    if (lat && lon) {
                        try {
                            const gmapUrl = `https://www.google.com/maps/search/?api=1&query=${lat},${lon}`;
                            const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(gmapUrl)}&margin=0`;
                            const resQr = await fetch(qrUrl); if(resQr.ok) { const blobQr = await resQr.blob(); qrCodeImg = await new Promise(r => { const reader = new FileReader(); reader.onloadend = () => r(reader.result); reader.readAsDataURL(blobQr); }); }
                        } catch(e) {}
                    }

                    let webMapHtml = '';
                    if (lat && lon) { webMapHtml = `<p class="mt-2 text-sm font-bold text-blue-800 mb-1">📍 GPS 位置：${latLon} <a href="https://www.google.com/maps/search/?api=1&query=${lat},${lon}" target="_blank" class="text-blue-600 underline ml-2 text-xs bg-blue-50 px-2 py-1 rounded">🗺️ 開啟地圖</a></p><iframe class="w-full h-40 rounded-lg border border-gray-300 mt-2" src="https://maps.google.com/maps?q=${lat},${lon}&z=16&output=embed" frameborder="0"></iframe>${weatherHtmlWeb}`; }

                    // 網頁版 HTML 組裝
                    webHtml += `<div class="mb-8 border border-gray-300 rounded-2xl shadow-md bg-white p-5 sm:p-8">`;
                    webHtml += `<div class="mb-4 border-b-2 border-gray-200 pb-4"><p class="text-xl font-extrabold text-gray-800 mb-1">📅 巡檢日期：${date}</p><p class="text-sm text-gray-500 font-medium">⏱️ 提交時間：${getVal(row, '提交時間')}</p></div>`;
                    webHtml += `<div class="bg-gray-50 p-4 rounded-xl mb-4 border border-gray-200 text-base leading-relaxed"><p class="mb-1"><span class="font-bold text-blue-800">👤 巡檢員：</span>${getVal(row, '巡檢人員')}</p><p class="mb-1"><span class="font-bold text-blue-800">🔧 作業：</span>${task}</p><p><span class="font-bold text-blue-800">📍 區域：</span>${getVal(row, '航廈')||''} - ${getVal(row, '區域')||''} <span class="text-gray-600 text-sm">(${getVal(row, '詳細位置')||''})</span></p></div>`;
                    webHtml += webMapHtml;
                    webHtml += `<h4 class="font-extrabold text-gray-800 text-lg border-b pb-1 mt-6 mb-4 flex items-center gap-2">📋 安全檢核項目</h4>`;

                    // 🚀 PDF 版 HTML 組裝 (回歸不指定高度，採用 avoid-break 自動防切斷排版)
                    let currentPdfHtml = `<div style="width: 800px; padding: 40px; font-family: sans-serif; background-color: white; color: #1f2937; margin: 0 auto;">`;
                    currentPdfHtml += PDF_HEADER_TEMPLATE;
                    
                    currentPdfHtml += `
                        <div style="margin-bottom: 20px;">
                            <p style="font-size: 18px; font-weight: bold; margin: 0 0 5px 0;">📅 巡檢日期：${date}</p>
                            <p style="font-size: 13px; color: #6b7280; margin: 0;">⏱️ 提交時間：${getVal(row, '提交時間')}</p>
                        </div>
                        <div class="avoid-break" style="background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 15px; margin-bottom: 20px; line-height: 1.6;">
                            <p style="margin: 0 0 5px 0; font-size: 15px;"><strong style="color: #1d4ed8;">👤 巡檢員：</strong><strong>${getVal(row, '巡檢人員')}</strong></p>
                            <p style="margin: 0 0 5px 0; font-size: 15px;"><strong style="color: #1d4ed8;">🔧 作業：</strong><strong>${task}</strong></p>
                            <p style="margin: 0; font-size: 15px;"><strong style="color: #1d4ed8;">📍 區域：</strong><strong>${getVal(row, '航廈')||''} - ${getVal(row, '區域')||''}</strong> <span style="color: #6b7280; font-size: 13px;">(${getVal(row, '詳細位置')||''})</span></p>
                        </div>
                        <div class="avoid-break" style="background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 15px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center;">
                            <div style="flex: 1;">
                                <p style="margin: 0 0 5px 0; font-size: 15px; font-weight: bold;">📍 GPS 位置：${latLon}</p>
                                <p style="margin: 0 0 10px 0; font-size: 11px; color: #9ca3af;">掃描 QR Code 開啟地圖</p>
                                ${weatherHtmlPdfInline}
                            </div>
                            ${qrCodeImg ? `<img src="${qrCodeImg}" style="width: 70px; height: 70px; mix-blend-mode: multiply;" crossorigin="anonymous">` : ''}
                        </div>
                        <h4 style="font-size: 16px; font-weight: bold; margin-bottom: 15px; border-bottom: 2px solid #e5e7eb; padding-bottom: 5px;">📋 安全檢核項目明細：</h4>
                    `;

                    filteredQ.forEach((q) => {
                        const qNum = q.id.replace('q', ''); 
                        let result = ans[q.id] || getVal(row, `Q${qNum}結果`) || '未檢測';
                        let note = notes[q.id] || getVal(row, `Q${qNum}說明`);
                        let pic = getVal(row, `Q${qNum}照片`);
                        let picUrls = pic ? pic.split('\n').filter(u => u.startsWith('http')) : [];

                        // Web 渲染
                        let webQBlock = `<div class="bg-gray-50 p-4 rounded-xl border border-gray-200 text-base mb-4"><p class="font-extrabold text-gray-900 text-lg mb-1"><span class="text-blue-600">[${q.category}]</span> ${q.item}</p><p class="text-gray-500 mb-3 text-sm">${q.standard}</p><p class="font-bold">檢查結果：<span class="${result==='異常'?'text-red-600':(result==='正常'?'text-green-600':'text-gray-500')}">${result}</span> ${note?`<span class="text-gray-500 font-normal ml-2">(${note})</span>`:''}</p>`;
                        if (picUrls.length > 0) { webQBlock += `<div class="mt-3 flex flex-wrap gap-2">`; picUrls.forEach(u => { webQBlock += `<img src="${u}" class="h-32 object-contain rounded-lg border shadow-sm" crossorigin="anonymous">`; }); webQBlock += `</div>`; }
                        webQBlock += `</div>`; webHtml += webQBlock;

                        // PDF 渲染 (使用 avoid-break)
                        let resColor = result === '異常' ? '#dc2626' : (result === '正常' ? '#16a34a' : '#6b7280');
                        let pdfQBlock = `
                            <div class="avoid-break" style="background-color: white; border: 1px solid #e5e7eb; border-radius: 8px; padding: 15px; margin-bottom: 15px;">
                                <p style="font-size: 15px; font-weight: bold; margin: 0 0 5px 0;">[${q.category}] ${q.item}</p>
                                <p style="font-size: 12px; color: #6b7280; margin: 0 0 10px 0;">${q.standard}</p>
                                <p style="font-size: 14px; font-weight: bold; margin: 0;">檢查結果：<span style="color: ${resColor};">${result}</span> ${note?`<span style="color: #6b7280; font-weight: normal; font-size: 13px; margin-left: 8px;">(說明：${note})</span>`:''}</p>`;
                        if (picUrls.length > 0) {
                            pdfQBlock += `<div style="margin-top: 10px; padding-top: 10px; border-top: 1px solid #f3f4f6; display: flex; flex-wrap: wrap; gap: 8px;">`;
                            picUrls.forEach(u => { pdfQBlock += `<img src="${u}" style="height: 80px; border-radius: 4px; border: 1px solid #e5e7eb; object-fit: contain;" crossorigin="anonymous">`; });
                            pdfQBlock += `</div>`;
                        }
                        pdfQBlock += `</div>`;
                        currentPdfHtml += pdfQBlock;
                    });

                    let overallPics = getVal(row, '現場整體照片'); let sigPic = getVal(row, '簽名檔') || getVal(row, '簽名') || getVal(row, '巡檢人員簽名確認');
                    
                    // Web Footer
                    let webFooter = `<div class="mt-8"><p class="font-extrabold text-lg mb-3">📸 現場整體照片:</p><div class="flex flex-wrap gap-3">`;
                    if (overallPics) { overallPics.split('\n').forEach(url => { if(url.startsWith('http')) webFooter += `<img src="${url}" class="h-32 w-32 object-cover rounded-xl shadow-sm border" crossorigin="anonymous">`; }); } else { webFooter += `<p class="text-gray-400">無</p>`; }
                    webFooter += `</div></div><div class="border-t-2 pt-5 mt-8 flex flex-col items-end gap-3"><p class="font-extrabold text-lg">巡檢人員簽名確認:</p>`;
                    if (sigPic && sigPic.startsWith('http')) { webFooter += `<img src="${sigPic}" class="h-20 object-contain" crossorigin="anonymous">`; } else if (sigPic) { webFooter += `<p class="font-bold text-red-500">${sigPic}</p>`; } else { webFooter += `<p class="font-bold text-gray-400">未簽名</p>`; }
                    webFooter += `</div></div>`; webHtml += webFooter;

                    // PDF Footer (使用 avoid-break)
                    let pdfFooter = `
                        <div class="avoid-break" style="margin-top: 20px; border-top: 2px solid #e5e7eb; padding-top: 20px;">
                            <p style="font-size: 15px; font-weight: bold; margin: 0 0 10px 0;">📸 現場整體照片:</p>
                            <div style="display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px;">`;
                    if (overallPics) { overallPics.split('\n').forEach(url => { if(url.startsWith('http')) pdfFooter += `<img src="${url}" style="width: 100px; height: 100px; object-fit: cover; border-radius: 6px; border: 1px solid #e5e7eb;" crossorigin="anonymous">`; }); } else { pdfFooter += `<p style="font-size: 12px; color: #9ca3af;">無</p>`; }
                    pdfFooter += `</div>
                            <div style="text-align: right; padding-right: 20px;">
                                <p style="font-size: 15px; font-weight: bold; margin: 0 0 10px 0;">巡檢人員簽名確認:</p>`;
                    if (sigPic && sigPic.startsWith('http')) { pdfFooter += `<img src="${sigPic}" style="height: 70px; object-fit: contain; margin-left: auto;" crossorigin="anonymous">`; } else if (sigPic) { pdfFooter += `<p style="font-size: 12px; font-weight: bold; color: #dc2626; margin: 0;">${sigPic}</p>`; } else { pdfFooter += `<p style="font-size: 12px; font-weight: bold; color: #9ca3af; margin: 0;">未簽名</p>`; }
                    pdfFooter += `</div></div></div>`; // 結束整份 PDF

                    currentPdfHtml += pdfFooter;
                    
                    if (i < data.length - 1) currentPdfHtml += `<div class="html2pdf__page-break"></div>`;
                    pdfHtmlStr += currentPdfHtml;
                }

                document.getElementById('reportContent').innerHTML = webHtml;
                document.getElementById('pdfExportContainer').innerHTML = pdfHtmlStr;
                document.getElementById('downloadPdfBtn').classList.remove('hidden');
            }).catch(err => { 
                console.error(err);
                document.getElementById('reportContent').innerHTML = `<p class="text-red-500 font-bold">⚠️ 連線或讀取失敗，請重新選擇日期或檢查網路。</p>`; 
            });
        }

        // 🚀 物理級 PDF 產出：回歸標準 normal flow 讓引擎自動對焦
        function downloadAdminReport() {
            try {
                if (typeof html2pdf === 'undefined') { alert("⚠️ PDF 轉換引擎尚未載入！"); return; }
                const btn = document.getElementById('downloadPdfBtn');
                if (currentPdfBlob) { triggerShareOrDownload(); return; }

                const date = document.getElementById('reportDate').value;
                const pdfContainer = document.getElementById('pdfExportContainer');
                const loadingOverlay = document.getElementById('loadingOverlay');
                const adminSection = document.getElementById('adminSection');
                const mainBody = document.getElementById('mainBody');
                
                loadingOverlay.classList.remove('hidden');
                loadingOverlay.classList.add('flex');
                
                btn.innerHTML = '🔄 PDF 產生準備中...';

                // 關閉所有干擾畫面的元素，讓 body 變成純白畫布
                const originalClasses = mainBody.className;
                mainBody.className = "bg-white m-0 p-0 block text-left";
                adminSection.style.display = 'none';

                // 將畫布實體化並放置於網頁最頂端，回歸最自然的 Document Flow
                pdfContainer.style.display = 'block';
                pdfContainer.style.position = 'relative';
                pdfContainer.style.margin = '0';
                window.scrollTo(0, 0);

                setTimeout(() => {
                    const opt = {
                        margin: [10, 0, 10, 0], // 保留天地邊界
                        filename: `信實集團_職安巡檢日報表_${date}.pdf`, 
                        image: { type: 'jpeg', quality: 1.0 }, 
                        html2canvas: { scale: 2, useCORS: true, logging: false }, 
                        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
                        pagebreak: { mode: ['css', 'legacy'], avoid: '.avoid-break' } // 啟用原生防切斷
                    };
                    
                    html2pdf().set(opt).from(pdfContainer).outputPdf('blob').then(function(pdfBlob) {
                        currentPdfBlob = pdfBlob; currentPdfFileName = `信實集團_職安巡檢日報表_${date}.pdf`;
                        
                        // 畫完後藏回暗處，復原介面
                        pdfContainer.style.display = 'none';
                        mainBody.className = originalClasses;
                        adminSection.style.display = 'block';
                        
                        loadingOverlay.classList.add('hidden'); loadingOverlay.classList.remove('flex');
                        
                        btn.innerHTML = '✅ 報表已就緒！點擊這裡 分享 / 下載';
                        btn.className = "w-full mt-6 bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg transition text-lg active:scale-95 animate-pulse";
                        triggerShareOrDownload();
                    }).catch(err => {
                        pdfContainer.style.display = 'none';
                        mainBody.className = originalClasses;
                        adminSection.style.display = 'block';
                        
                        loadingOverlay.classList.add('hidden'); loadingOverlay.classList.remove('flex');
                        alert("產出過程發生錯誤，請稍後重試。");
                    });
                }, 1000); // 確保手機瀏覽器有足夠時間將隱藏元素畫出來
            } catch (e) { alert("執行發生例外錯誤：" + e.message); }
        }

        function triggerShareOrDownload() {
            const file = new File([currentPdfBlob], currentPdfFileName, { type: 'application/pdf' });
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

            if (isMobile && navigator.canShare && navigator.canShare({ files: [file] })) {
                navigator.share({ files: [file] }).catch(err => console.log('分享取消或失敗:', err));
            } else {
                const url = URL.createObjectURL(currentPdfBlob); const a = document.createElement('a'); a.href = url; a.download = currentPdfFileName; document.body.appendChild(a); a.click(); document.body.removeChild(a); setTimeout(() => URL.revokeObjectURL(url), 100);
            }
        }
    </script>
